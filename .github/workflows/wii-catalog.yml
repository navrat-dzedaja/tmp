name: Wii Vault catalogue

# Runs vimm-wii/vimm-wii-catalog.sh on a GitHub-hosted macOS runner, which is
# both the script's target platform and a machine with unrestricted egress.
#
# The push trigger currently runs the FULL catalogue (all sections, no limit,
# 2 parallel fetches ~ 2 req/s, roughly 20-25 min). Change the env defaults
# below back to sections 'G' / limit '8' / jobs '1' for cheap smoke runs.
# "Run workflow" takes the same knobs as inputs.

on:
  workflow_dispatch:
    inputs:
      sections:
        description: 'Sections to scrape ("all", or e.g. "G" / "number A B")'
        default: 'G'
      limit:
        description: 'Max games (0 = no limit)'
        default: '8'
      delay:
        description: 'Seconds between requests'
        default: '1.0'
      jobs:
        description: 'Parallel detail fetches'
        default: '1'
      runner:
        description: 'Runner image'
        type: choice
        options: ['macos-latest', 'ubuntu-latest']
        default: 'macos-latest'
  push:
    branches: ['claude/wii-games-scraper-csv-oqlhib']
    paths:
      - 'vimm-wii/**'
      - '.github/workflows/wii-catalog.yml'

permissions:
  contents: read

jobs:
  self-test:
    name: Offline self-test (bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash version
        run: /bin/bash --version | head -1
      - name: Run self-test
        run: ./vimm-wii/vimm-wii-catalog.sh --self-test

  scrape:
    name: Live scrape
    needs: self-test
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 360
    env:
      SECTIONS: ${{ inputs.sections || 'all' }}
      LIMIT: ${{ inputs.limit || '0' }}
      DELAY: ${{ inputs.delay || '1.0' }}
      JOBS: ${{ inputs.jobs || '2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Can we reach vimm.net at all?
        run: |
          echo "runner egress check:"
          curl -sS -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
            -A 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)' \
            https://vimm.net/vault/Wii || echo "curl failed: $?"

      # Show what the server really returns for both list URL forms and for a
      # detail page, so selector mismatches are diagnosable from this log.
      - name: Probe page structure
        run: |
          chmod +x vimm-wii/probe.sh
          echo "##### plain section listing"
          ./vimm-wii/probe.sh "$(./vimm-wii/vimm-wii-catalog.sh --print-url G)"
          echo
          echo "##### country-filter listing"
          ./vimm-wii/probe.sh "$(./vimm-wii/vimm-wii-catalog.sh --filters --print-url G)"
          echo
          echo "##### a detail page (Ghostbusters, from the screenshots)"
          ./vimm-wii/probe.sh "https://vimm.net/vault/17493"

      - name: Scrape
        id: scrape
        continue-on-error: true
        run: |
          set -o pipefail
          args=""
          [ "$SECTIONS" != "all" ] && args="$args -s $SECTIONS"
          [ "$LIMIT" != "0" ] && args="$args --limit $LIMIT"
          echo "running: vimm-wii-catalog.sh $args -d $DELAY -j $JOBS"
          ./vimm-wii/vimm-wii-catalog.sh $args -d "$DELAY" -j "$JOBS" \
            -o wii_games.csv -c .vimm-cache 2>&1 | tee run.log

      # Whatever happened above, show enough of the real markup to fix selectors.
      - name: Diagnostics
        if: always()
        run: |
          echo "=== files ==="
          ls -la .vimm-cache/list .vimm-cache/detail 2>/dev/null | head -20 || true

          # NB: BSD grep caps regex repetition at 255, so excerpting is done in
          # perl rather than with grep -o '.\{0,500\}'.
          dump_rows() { # dump_rows FILE N -- first N <tr> blocks holding a game link
            perl -e '
              local $/; my $h = <STDIN>; $h =~ s/\r?\n/ /g;
              my $want = $ARGV[0] || 3; my $n = 0;
              for my $r (split /<tr\b/i, $h) {
                next unless $r =~ m{/vault/\d+}i;
                print "[row] <tr", substr($r, 0, 400), "\n\n";
                last if ++$n >= $want;
              }
              print "(no <tr> block contained a /vault/ link)\n" unless $n;
            ' "$2" <"$1"
          }

          list=$(ls .vimm-cache/list/*.html 2>/dev/null | head -1)
          if [ -n "$list" ]; then
            echo
            echo "=== list page: $list ($(wc -c <"$list") bytes) ==="
            dump_rows "$list" 3
          fi

          det=$(ls .vimm-cache/detail/*.html 2>/dev/null | head -1)
          if [ -n "$det" ]; then
            echo
            echo "=== detail page: $det ($(wc -c <"$det") bytes) ==="
            perl -e '
              local $/; my $h = <STDIN>; $h =~ s/\r?\n/ /g;
              my $n = 0;
              for my $r (split /<tr\b/i, $h) {
                next unless $r =~ m{<t[dh]\b}i;
                print "[tr] ", substr($r, 0, 220), "\n";
                last if ++$n >= 16;
              }
              if ($h =~ m{(.{0,400}Download.{0,400})}is) {
                print "\n[download box] $1\n";
              }
            ' <"$det"
          fi

          echo
          echo "=== parsed rows (first 3, tab separated) ==="
          head -3 .vimm-cache/work/rows.tsv 2>/dev/null || echo "(no rows.tsv)"
          echo
          echo "=== where each size came from (size_gb, id, name, regex) ==="
          head -10 .vimm-cache/work/size-source.tsv 2>/dev/null || echo "(none)"
          echo
          echo "=== CSV ==="
          head -10 wii_games.csv 2>/dev/null || echo "(no CSV produced)"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Wii catalogue run"
            echo
            echo "Sections \`$SECTIONS\`, limit \`$LIMIT\`, delay \`${DELAY}s\`, jobs \`$JOBS\`"
            echo
            if [ -s wii_games.csv ]; then
              echo '```'
              tail -8 run.log
              echo '```'
              echo
              echo "Rows in CSV: $(( $(wc -l <wii_games.csv) - 1 ))"
            else
              echo "No CSV produced -- see the Diagnostics step."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wii-catalogue
          path: |
            wii_games.csv
            run.log
            .vimm-cache/work/rows.tsv
            .vimm-cache/work/size-source.tsv
          if-no-files-found: warn
          retention-days: 14

      # Keep a couple of raw pages so the markup can be inspected offline.
      - name: Sample raw HTML
        if: always()
        run: |
          mkdir -p samples
          ls .vimm-cache/list/*.html 2>/dev/null | head -1 | xargs -I{} cp {} samples/ || true
          ls .vimm-cache/detail/*.html 2>/dev/null | head -2 | xargs -I{} cp {} samples/ || true
          ls -la samples || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-html-samples
          path: samples/
          if-no-files-found: warn
          retention-days: 14

      # Last step on purpose: the log tail is the cheapest thing to read back,
      # so the numbers that matter go here rather than mid-job.
      - name: Report
        if: always()
        run: |
          echo "===== SIZE SOURCE DISTRIBUTION ====="
          cut -f4 .vimm-cache/work/size-source.tsv 2>/dev/null | sort | uniq -c | sort -rn || echo none
          echo "===== CSV ====="
          head -12 wii_games.csv 2>/dev/null || echo "(no CSV)"
          echo "===== TOTAL ====="
          tail -5 run.log 2>/dev/null || echo "(no run.log)"
          echo "===== WHERE THE SIZE LIVES (one Wii detail page) ====="
          perl -e '
            local $/; my $h = <STDIN>; $h =~ s/\r?\n/ /g;
            if ($h =~ m{(<tr\b[^>]*\bid=["\x27]dl-row["\x27].*?</tr>)}is) {
              print "[dl-row] ", substr($1, 0, 900), "\n\n";
            } else { print "[dl-row] not found\n\n" }
            my $n = 0;
            for my $s ($h =~ m{<script\b[^>]*>(.*?)</script>}gis) {
              next unless $s =~ /media|Size|size/;
              next if $s =~ /gtag|dataLayer/;
              print "[script ", ++$n, "] ", substr($s, 0, 700), "\n\n";
              last if $n >= 2;
            }
            print "[script] none mentioning media/size\n" unless $n;
          ' <"$(ls .vimm-cache/detail/*.html | head -1)" || true
          echo "===== END ====="

      - name: Fail if the scrape failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1
