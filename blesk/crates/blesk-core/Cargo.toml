[package]
name = "blesk-core"
version = "0.1.0"
edition = "2021"
description = "UI-agnostic player core: source protocols (M3U, Xtream Codes, Stalker/Ministra), addon system, Stremio addon compatibility"
license = "MIT"

[dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
