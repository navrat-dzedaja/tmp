[project]
name = "sports-digest"
version = "0.1.0"
description = "Scheduled sports match digest: RSS + scraping + football-data.org -> LLM summary -> Telegram"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10",
    "httpx[http2]>=0.27",
    "feedparser>=6.0",
    "selectolax>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
